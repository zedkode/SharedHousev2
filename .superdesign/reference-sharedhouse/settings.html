<!DOCTYPE html><html lang="en"><head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-warm: #F7F2EA;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.35);
            --text-main: #3A332C;
            --text-muted: #7A6F63;
            --accent-terracotta: #C1673F;
            --accent-sage: #7C8B6F;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-warm);
            margin: 0;
            padding: 0;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(58, 51, 44, 0.04);
            border-radius: 24px;
        }

        .organic-blob {
            position: absolute;
            filter: blur(60px);
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }

        /* Toggle Switch Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: var(--accent-sage);
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: var(--accent-sage);
        }

        .custom-toggle {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .custom-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #D1CEC9;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-sage);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>

    <script>
        // Simple micro-interactions for checkboxes/toggles
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', function() {
                // Add a haptic feedback feel
                this.parentElement.classList.add('scale-95');
                setTimeout(() => this.parentElement.classList.remove('scale-95'), 100);
            });
        });

        // Highlight back button logic
        const backBtn = document.getElementById('back-to-home');
        backBtn.addEventListener('click', () => {
            backBtn.classList.add('scale-90', 'opacity-50');
        });
    </script>
