name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Run repository checks
        run: npm run check

      - name: Verify API runtime persistence
        run: npm run smoke:api

  shared-jvm:
    name: Shared Kotlin JVM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test shared modules on the JVM
        run: ./gradlew :shared:domain:jvmTest :shared:network:jvmTest --no-daemon

  android:
    name: Android debug gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android lint, unit tests and debug assembly
        run: >-
          ./gradlew
          :apps:android:app:lintDebug
          :apps:android:app:testDebugUnitTest
          :apps:android:app:assembleDebug
          --no-daemon

      - name: Verify debug APK output
        run: test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
