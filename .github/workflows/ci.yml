name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Run repository checks
        run: npm run check

      - name: Verify API runtime persistence
        run: npm run smoke:api

  shared-jvm:
    name: Shared Kotlin JVM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test shared modules on the JVM
        run: ./gradlew :shared:domain:jvmTest :shared:network:jvmTest --no-daemon

  android:
    name: Android public configuration gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run public Android lint, unit tests and named testing assembly
        run: >-
          ./gradlew
          :apps:android:app:lintPublicDebug
          :apps:android:app:testPublicDebugUnitTest
          :apps:android:app:packagePublicTestingApk
          --no-daemon

      - name: Verify named public testing APK output
        run: >-
          test -s
          apps/android/app/build/outputs/apk/testing/SharedHouse-v0.3.7-public-testing-signed.apk

      - name: Upload public testing APK
        uses: actions/upload-artifact@v7
        with:
          name: SharedHouse-v0.3.7-public-testing-apk
          path: apps/android/app/build/outputs/apk/testing/SharedHouse-v0.3.7-public-testing-signed.apk
          if-no-files-found: error
