name: sharedhouse-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sharedhouse_local}
      POSTGRES_USER: ${POSTGRES_USER:-sharedhouse_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetic-local-only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --save
      - '60'
      - '1'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_USER:-sharedhouse_local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_PASSWORD:-synthetic-local-only}
    ports:
      - '${OBJECT_STORAGE_PORT:-9000}:9000'
      - '${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - object-storage-data:/data

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
