name: ${SHAREDHOUSE_COMPOSE_PROJECT:-sharedhouse-production}

services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharedhouse
      POSTGRES_USER: sharedhouse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/17/docker
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sharedhouse -d sharedhouse']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  api:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.api
    image: sharedhouse-api:${SHAREDHOUSE_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    env_file:
      - production.env
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      EMAIL_OUTBOX_ENCRYPTION_KEY_BASE64_FILE: /run/secrets/email_outbox_key
    secrets:
      - postgres_password
      - resend_api_key
      - email_outbox_key
    # File-backed Compose secrets retain host ownership. Keep them root:root
    # 0640 and grant only this non-root process supplemental group 0.
    group_add:
      - '0'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - edge
    expose:
      - '3000'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *bounded-logging

  workers:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.workers
    image: sharedhouse-workers:${SHAREDHOUSE_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    env_file:
      - production.env
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    group_add:
      - '0'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    group_add:
      - '0'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  resend_api_key:
    file: ./secrets/resend_api_key
  email_outbox_key:
    file: ./secrets/email_outbox_key
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
