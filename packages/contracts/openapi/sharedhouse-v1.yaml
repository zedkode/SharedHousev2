openapi: 3.1.0
info:
  title: SharedHouse API
  version: 1.4.0
  description: Versioned public contract for the SharedHouse coordination platform.
servers:
  - url: https://houseapi.dohotstudio.com
    description: SharedHouse production API
  - url: http://localhost:3000
    description: Synthetic local development environment
tags:
  - name: Operations
  - name: Authentication
  - name: Account
  - name: Households
  - name: Invitations
  - name: Calendar
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report API process health
      tags: [Operations]
      responses:
        '200':
          description: The API process is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /v1/health/ready:
    get:
      operationId: getReadiness
      summary: Report API and database readiness
      tags: [Operations]
      responses:
        '200':
          description: The API process and database are ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/auth/register:
    post:
      operationId: registerAccount
      summary: Register an adult account and start email verification
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration was accepted. The response is intentionally generic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume a single-use email verification code and create a session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified and session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/resend-verification:
    post:
      operationId: resendEmailVerification
      summary: Request another single-use email verification code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
      responses:
        '202':
          description: The request was accepted without disclosing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Create a session with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new session token pair
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
      responses:
        '200':
          description: Session token pair rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current session
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked.
        '401':
          $ref: '#/components/responses/Problem'
  /v1/account:
    get:
      operationId: getAccount
      summary: Return the authenticated account
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Safe account representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAccount
      summary: Re-authenticate, close eligible sole-member households, and delete the account
      tags: [Account]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Credentials were removed, sessions revoked, and the profile anonymised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          description: Ownership must be transferred while another active household member remains.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/account/export:
    post:
      operationId: exportAccount
      summary: Re-authenticate and download the current account data as JSON
      tags: [Account]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportAccountRequest'
      responses:
        '200':
          description: A machine-readable snapshot of data associated with the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households:
    get:
      operationId: listHouseholds
      summary: List households available to the authenticated member
      tags: [Households]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Household memberships visible to the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdSummary'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createHousehold
      summary: Create a household and its owner membership atomically
      tags: [Households]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdConfiguration'
      responses:
        '201':
          description: Household and owner membership created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: getHousehold
      summary: Read one household through an active membership
      tags: [Households]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Household configuration visible to the member.
          headers:
            ETag:
              schema:
                type: string
              description: Quoted household version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateHousehold
      summary: Replace the configurable household foundation using optimistic locking
      tags: [Households]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdConfiguration'
      responses:
        '200':
          description: Household configuration updated.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/invitations:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listHouseholdInvitations
      summary: List safe invitation metadata for household administrators
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitations visible to an authorised household administrator.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdInvitationSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createHouseholdInvitation
      summary: Create a seven-day single-use household invitation
      tags: [Invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdInvitationRequest'
      responses:
        '201':
          description: Invitation created; the secret token is returned only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdInvitationCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      operationId: revokeHouseholdInvitation
      summary: Revoke a pending household invitation idempotently
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Invitation revoked or already terminal without acceptance.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/invitations/{invitationToken}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      operationId: previewHouseholdInvitation
      summary: Preview safe household invitation metadata
      tags: [Invitations]
      responses:
        '200':
          description: Safe invitation preview without the restricted email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdInvitationPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/invitations/{invitationToken}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: acceptHouseholdInvitation
      summary: Accept a single-use invitation as the authenticated account
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitation accepted or safely replayed by the accepting account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptHouseholdInvitationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/calendar-events:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listCalendarEvents
      summary: List active one-off household calendar events in an inclusive local-date range
      tags: [Calendar]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive end date. A query can cover at most 370 days.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Events visible to the active household member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEventSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCalendarEvent
      summary: Create a one-off household calendar event idempotently
      tags: [Calendar]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventConfiguration'
      responses:
        '201':
          description: Calendar event created or the original idempotent response replayed.
          headers:
            ETag:
              schema:
                type: string
              description: Quoted calendar event version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/calendar-events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/CalendarEventId'
    patch:
      operationId: updateCalendarEvent
      summary: Replace a one-off calendar event using optimistic locking
      tags: [Calendar]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventConfiguration'
      responses:
        '200':
          description: Calendar event updated.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCalendarEvent
      summary: Soft-delete a one-off calendar event using optimistic locking
      tags: [Calendar]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Event deleted, including a safe replay of the same deletion.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarEventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: invitationToken
      in: path
      required: true
      schema:
        type: string
        pattern: '^sh_inv_[A-Za-z0-9_-]{43}$'
        writeOnly: true
  responses:
    Problem:
      description: Request failed with a safe problem-details response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion, checkedAt]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: api
        apiVersion:
          type: string
          const: v1
        checkedAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        correlationId:
          type: string
          format: uuid
        detail:
          type: string
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, email, emailVerified, displayName, preferredLocale]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        displayName:
          type: string
        preferredLocale:
          type: string
          enum: [en, ro]
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [password, confirmation]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        confirmation:
          type: string
          const: DELETE
    AccountDeletionResult:
      type: object
      additionalProperties: false
      required: [status, closedHouseholdIds, transferredHouseholdIds]
      properties:
        status:
          type: string
          const: completed
        closedHouseholdIds:
          type: array
          items:
            type: string
            format: uuid
        transferredHouseholdIds:
          type: array
          items:
            type: string
            format: uuid
    ExportAccountRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    AccountExport:
      type: object
      description: Versioned JSON export. Nested records follow the public account, household, calendar, invitation, consent and session contracts.
      required:
        [
          formatVersion,
          generatedAt,
          account,
          households,
          calendarEvents,
          consentRecords,
          sessions,
          invitations,
        ]
      properties:
        formatVersion:
          type: string
          const: '1'
        generatedAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/AccountSummary'
        households:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdSummary'
        calendarEvents:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEventSummary'
        consentRecords:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [purpose, policyVersion, granted, recordedAt]
            properties:
              purpose: { type: string }
              policyVersion: { type: string }
              granted: { type: boolean }
              recordedAt: { type: string, format: date-time }
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [deviceName, authenticatedAt, lastSeenAt, revokedAt]
            properties:
              deviceName: { type: string }
              authenticatedAt: { type: string, format: date-time }
              lastSeenAt: { type: string, format: date-time }
              revokedAt: { type: [string, 'null'], format: date-time }
        invitations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, householdId, role, email, status, expiresAt, createdAt]
            properties:
              id: { type: string, format: uuid }
              householdId: { type: string, format: uuid }
              role: { type: string, enum: [admin, member, read_only] }
              email: { type: [string, 'null'], format: email }
              status: { type: string, enum: [pending, accepted, revoked, expired] }
              expiresAt: { type: string, format: date-time }
              createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - displayName
        - preferredLocale
        - ageConfirmed
        - termsAccepted
        - marketingConsent
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        preferredLocale:
          type: string
          enum: [en, ro]
        ageConfirmed:
          type: boolean
          const: true
        termsAccepted:
          type: boolean
          const: true
        marketingConsent:
          type: boolean
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [verificationRequired]
      properties:
        verificationRequired:
          type: boolean
          const: true
        developmentVerificationCode:
          type: string
          pattern: '^[0-9]{8}$'
          description: Present only in explicitly non-production local or test environments.
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: '^[0-9]{8}$'
          writeOnly: true
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
    ResendEmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 40
          maxLength: 256
          writeOnly: true
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - account
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
