openapi: 3.1.0
info:
  title: SharedHouse API
  version: 1.11.0
  description: Versioned public contract for the SharedHouse coordination platform.
servers:
  - url: https://houseapi.dohotstudio.com
    description: SharedHouse production API
  - url: http://localhost:3000
    description: Synthetic local development environment
tags:
  - name: Operations
  - name: Authentication
  - name: Account
  - name: Households
  - name: Invitations
  - name: Calendar
  - name: Money
  - name: Tasks
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report API process health
      tags: [Operations]
      responses:
        '200':
          description: The API process is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /v1/health/ready:
    get:
      operationId: getReadiness
      summary: Report API and database readiness
      tags: [Operations]
      responses:
        '200':
          description: The API process and database are ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/auth/register:
    post:
      operationId: registerAccount
      summary: Register an adult account and start email verification
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration was accepted. The response is intentionally generic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume a single-use email verification code and create a session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified and session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/resend-verification:
    post:
      operationId: resendEmailVerification
      summary: Request another single-use email verification code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
      responses:
        '202':
          description: The request was accepted without disclosing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Create a session with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new session token pair
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
      responses:
        '200':
          description: Session token pair rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current session
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked.
        '401':
          $ref: '#/components/responses/Problem'
  /v1/account:
    get:
      operationId: getAccount
      summary: Return the authenticated account
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Safe account representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAccount
      summary: Re-authenticate, close eligible sole-member households, and delete the account
      tags: [Account]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Credentials were removed, sessions revoked, and the profile anonymised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          description: Ownership must be transferred while another active household member remains.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/account/export:
    post:
      operationId: exportAccount
      summary: Re-authenticate and download the current account data as JSON
      tags: [Account]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportAccountRequest'
      responses:
        '200':
          description: A machine-readable snapshot of data associated with the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households:
    get:
      operationId: listHouseholds
      summary: List households available to the authenticated member
      tags: [Households]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Household memberships visible to the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdSummary'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createHousehold
      summary: Create a household and its owner membership atomically
      tags: [Households]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdConfiguration'
      responses:
        '201':
          description: Household and owner membership created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: getHousehold
      summary: Read one household through an active membership
      tags: [Households]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Household configuration visible to the member.
          headers:
            ETag:
              schema:
                type: string
              description: Quoted household version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateHousehold
      summary: Replace the configurable household foundation using optimistic locking
      tags: [Households]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdConfiguration'
      responses:
        '200':
          description: Household configuration updated.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/members:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listHouseholdMembers
      summary: List current and historical household memberships with caller-specific capabilities
      tags: [Households]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Membership board visible to an active household member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdMemberBoard'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/members/{membershipId}/actions:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: actOnHouseholdMember
      summary: Change role, suspend, reactivate, remove or transfer ownership idempotently
      description: The server enforces owner and administrator delegation boundaries. Ownership transfer atomically demotes the current owner to administrator and promotes one active writable member.
      tags: [Households]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdMemberActionRequest'
      responses:
        '200':
          description: Updated target membership or the original idempotent response.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdMemberSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/invitations:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listHouseholdInvitations
      summary: List safe invitation metadata for household administrators
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitations visible to an authorised household administrator.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdInvitationSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createHouseholdInvitation
      summary: Create a seven-day single-use household invitation
      tags: [Invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdInvitationRequest'
      responses:
        '201':
          description: Invitation created; the secret token is returned only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdInvitationCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      operationId: revokeHouseholdInvitation
      summary: Revoke a pending household invitation idempotently
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Invitation revoked or already terminal without acceptance.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/invitations/{invitationToken}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      operationId: previewHouseholdInvitation
      summary: Preview safe household invitation metadata
      tags: [Invitations]
      responses:
        '200':
          description: Safe invitation preview without the restricted email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdInvitationPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/invitations/{invitationToken}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: acceptHouseholdInvitation
      summary: Accept a single-use invitation as the authenticated account
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitation accepted or safely replayed by the accepting account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptHouseholdInvitationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/calendar-events:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listCalendarEvents
      summary: List active one-off household calendar events in an inclusive local-date range
      tags: [Calendar]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive end date. A query can cover at most 370 days.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Events visible to the active household member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEventSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCalendarEvent
      summary: Create a one-off household calendar event idempotently
      tags: [Calendar]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventConfiguration'
      responses:
        '201':
          description: Calendar event created or the original idempotent response replayed.
          headers:
            ETag:
              schema:
                type: string
              description: Quoted calendar event version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/calendar-events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/CalendarEventId'
    patch:
      operationId: updateCalendarEvent
      summary: Replace a one-off calendar event using optimistic locking
      tags: [Calendar]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventConfiguration'
      responses:
        '200':
          description: Calendar event updated.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCalendarEvent
      summary: Soft-delete a one-off calendar event using optimistic locking
      tags: [Calendar]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Event deleted, including a safe replay of the same deletion.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/billing-roster:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: getBillingRoster
      summary: Read the people and couples used for equal household-cost splitting
      tags: [Money]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active app members plus configured couples and no-account partners.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRosterSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: replaceBillingRoster
      summary: Replace the active couple configuration without deleting its history
      description: Each active member may appear in at most one couple. A partner may be another account member or a named person without app access.
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBillingRosterRequest'
      responses:
        '200':
          description: Billing roster replaced or the original idempotent result replayed.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRosterSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expenses:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listExpenses
      summary: List the append-only expense ledger visible to an active household member
      tags: [Money]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Household expense entries with the caller's authoritative allocation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createExpense
      summary: Record an equally split household expense idempotently
      description: Owner and admin entries are approved immediately. Member entries are proposals. Read-only members cannot create entries.
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseConfiguration'
      responses:
        '201':
          description: Expense recorded, or the original idempotent response replayed.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseId'
    get:
      operationId: getExpense
      summary: Get one authoritative household expense entry
      tags: [Money]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expense entry and its exact allocation breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expenses/{expenseId}/approve:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseId'
    post:
      operationId: approveExpense
      summary: Approve a proposed expense using optimistic locking
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Proposal approved without rewriting its financial history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expenses/{expenseId}/reverse:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseId'
    post:
      operationId: reverseExpense
      summary: Reverse an expense with a reason while preserving append-only history
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseExpenseRequest'
      responses:
        '201':
          description: Expense reversed and retained in the ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expenses/{expenseId}/payments:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseId'
    post:
      operationId: declareExpensePayment
      summary: Declare that the caller paid their approved expense allocation
      description: This records a member declaration only. SharedHouse does not move money and another authorised member must confirm it.
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePaymentDeclarationRequest'
      responses:
        '201':
          description: Payment declaration recorded, or the original idempotent request replayed.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expenses/{expenseId}/payments/{paymentId}/confirm:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: confirmExpensePayment
      summary: Confirm another member's payment declaration
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Payment declaration confirmed without changing the original charge.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expenses/{expenseId}/payments/{paymentId}/dispute:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: disputeExpensePayment
      summary: Contest another member's payment declaration with a reason
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePaymentActionRequest'
      responses:
        '201':
          description: Payment declaration disputed with an append-only event.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expenses/{expenseId}/payments/{paymentId}/reverse:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseId'
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: reverseExpensePayment
      summary: Correct a payment declaration while retaining its complete history
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePaymentActionRequest'
      responses:
        '201':
          description: Payment declaration reversed with an append-only event.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expense-templates:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listExpenseTemplates
      summary: List reusable household costs visible to the member
      description: Owners and administrators also receive archived templates and management capability.
      tags: [Money]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reusable household costs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseTemplateSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createExpenseTemplate
      summary: Create a reusable household cost as owner or administrator
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseTemplateConfiguration'
      responses:
        '201':
          description: Household cost created or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseTemplateSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expense-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseTemplateId'
    patch:
      operationId: updateExpenseTemplate
      summary: Update an active household cost without rewriting existing expenses
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseTemplateConfiguration'
      responses:
        '200':
          description: Household cost updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseTemplateSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/expense-templates/{templateId}/archive:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/ExpenseTemplateId'
    post:
      operationId: archiveExpenseTemplate
      summary: Archive a household cost with a reason while retaining history
      tags: [Money]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveExpenseTemplateRequest'
      responses:
        '201':
          description: Household cost archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseTemplateSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/households/{householdId}/tasks:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listHouseholdTasks
      summary: Read the role-aware household task board
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active household members and authoritative task state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdTaskBoard'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createHouseholdTask
      summary: Create and assign a household task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdTaskConfiguration'
      responses:
        '201':
          description: Task created by an owner or administrator.
          headers:
            ETag: { $ref: '#/components/headers/EntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdTaskSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/households/{householdId}/tasks/{taskId}/actions:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: actOnHouseholdTask
      summary: Commit a task transition or request decision
      description: Completion and request decisions append evidence and never delete prior history.
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdTaskActionRequest' }
      responses:
        '201':
          description: Action committed.
          headers:
            ETag: { $ref: '#/components/headers/EntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdTaskSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarEventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseTemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: invitationToken
      in: path
      required: true
      schema:
        type: string
        pattern: '^sh_inv_[A-Za-z0-9_-]{43}$'
        writeOnly: true
  responses:
    Problem:
      description: Request failed with a safe problem-details response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion, checkedAt]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: api
        apiVersion:
          type: string
          const: v1
        checkedAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        correlationId:
          type: string
          format: uuid
        detail:
          type: string
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, email, emailVerified, displayName, preferredLocale]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        displayName:
          type: string
        preferredLocale:
          type: string
          enum: [en, ro]
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [password, confirmation]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        confirmation:
          type: string
          const: DELETE
    AccountDeletionResult:
      type: object
      additionalProperties: false
      required: [status, closedHouseholdIds, transferredHouseholdIds]
      properties:
        status:
          type: string
          const: completed
        closedHouseholdIds:
          type: array
          items:
            type: string
            format: uuid
        transferredHouseholdIds:
          type: array
          items:
            type: string
            format: uuid
    ExportAccountRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    AccountExport:
      type: object
      description: Versioned JSON export. Nested records follow the public account, household, calendar, invitation, consent and session contracts.
      required:
        [
          formatVersion,
          generatedAt,
          account,
          households,
          calendarEvents,
          householdTasks,
          expenses,
          expenseTemplates,
          consentRecords,
          sessions,
          invitations,
        ]
      properties:
        formatVersion:
          type: string
          const: '1'
        generatedAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/AccountSummary'
        households:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdSummary'
        calendarEvents:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEventSummary'
        householdTasks:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdTaskSummary'
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSummary'
        expenseTemplates:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseTemplateSummary'
        consentRecords:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [purpose, policyVersion, granted, recordedAt]
            properties:
              purpose: { type: string }
              policyVersion: { type: string }
              granted: { type: boolean }
              recordedAt: { type: string, format: date-time }
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [deviceName, authenticatedAt, lastSeenAt, revokedAt]
            properties:
              deviceName: { type: string }
              authenticatedAt: { type: string, format: date-time }
              lastSeenAt: { type: string, format: date-time }
              revokedAt: { type: [string, 'null'], format: date-time }
        invitations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, householdId, role, email, status, expiresAt, createdAt]
            properties:
              id: { type: string, format: uuid }
              householdId: { type: string, format: uuid }
              role: { type: string, enum: [admin, member, read_only] }
              email: { type: [string, 'null'], format: email }
              status: { type: string, enum: [pending, accepted, revoked, expired] }
              expiresAt: { type: string, format: date-time }
              createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - displayName
        - preferredLocale
        - ageConfirmed
        - termsAccepted
        - marketingConsent
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        preferredLocale:
          type: string
          enum: [en, ro]
        ageConfirmed:
          type: boolean
          const: true
        termsAccepted:
          type: boolean
          const: true
        marketingConsent:
          type: boolean
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [verificationRequired]
      properties:
        verificationRequired:
          type: boolean
          const: true
        developmentVerificationCode:
          type: string
          pattern: '^[0-9]{8}$'
          description: Present only in explicitly non-production local or test environments.
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: '^[0-9]{8}$'
          writeOnly: true
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
    ResendEmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 40
          maxLength: 256
          writeOnly: true
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - account
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/AccountSummary'
    HouseholdConfiguration:
      type: object
      additionalProperties: false
      required: [name, countryCode, timezone, currency, firstDayOfWeek, cycleType, cycleAnchor]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        firstDayOfWeek:
          type: integer
          enum: [1, 6, 7]
          description: ISO weekday number for Monday, Saturday or Sunday.
        cycleType:
          type: string
          enum: [weekly, fourteen_day, calendar_month]
        cycleAnchor:
          type: string
          format: date
    HouseholdSummary:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/HouseholdConfiguration'
        - type: object
          required: [id, role, status, version, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            role:
              type: string
              enum: [owner, admin, member, read_only]
            status:
              type: string
              const: active
            version:
              type: integer
              minimum: 1
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    HouseholdMemberSummary:
      type: object
      additionalProperties: false
      required:
        [
          membershipId,
          userId,
          displayName,
          role,
          status,
          isCurrentUser,
          canChangeRole,
          canSuspend,
          canReactivate,
          canRemove,
          canTransferOwnership,
          assignableRoles,
          joinedAt,
          updatedAt,
          version,
        ]
      properties:
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        role:
          type: string
          enum: [owner, admin, member, read_only]
        status:
          type: string
          enum: [active, suspended, left, removed]
        isCurrentUser:
          type: boolean
        canChangeRole:
          type: boolean
        canSuspend:
          type: boolean
        canReactivate:
          type: boolean
        canRemove:
          type: boolean
        canTransferOwnership:
          type: boolean
        assignableRoles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [admin, member, read_only]
        joinedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    HouseholdMemberBoard:
      type: object
      additionalProperties: false
      required: [canInvite, canEditHousehold, members]
      properties:
        canInvite:
          type: boolean
        canEditHousehold:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdMemberSummary'
    HouseholdMemberActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [change_role, suspend, reactivate, remove, transfer_ownership]
        role:
          type: [string, 'null']
          enum: [admin, member, read_only, null]
          description: Required only for change_role.
        reason:
          type: [string, 'null']
          minLength: 3
          maxLength: 240
    CreateHouseholdInvitationRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member, read_only]
